x-agent: &agent
  build: .
  env_file: .env
  restart: unless-stopped
  environment:
    DATABASE_URL: ${RESOURCEPILOT_DATABASE_URL:?Set RESOURCEPILOT_DATABASE_URL to managed Postgres}
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import json,urllib.request; u='http://127.0.0.1:18000/health'; assert json.load(urllib.request.urlopen(u))['status']=='ok'",
      ]
    interval: 15s
    timeout: 3s
    retries: 8
    start_period: 20s

# Persistent mailbox runtimes. No host port is published: Inspector connection happens locally
# first, then these always-on containers reuse the same seeds and receive through Mailbox.
services:
  orchestrator:
    <<: *agent
    environment:
      DATABASE_URL: ${RESOURCEPILOT_DATABASE_URL:?Set RESOURCEPILOT_DATABASE_URL to managed Postgres}
      AGENT_MODULE: agents.run
      AGENT_ROLE: orchestrator
      AGENT_PORT: ${ORCHESTRATOR_PORT}

  intake:
